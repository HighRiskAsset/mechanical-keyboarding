<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical Keyboarding</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- the loading card's styling is inlined so the card paints and starts moving
     on the very first frame, with nothing downloaded yet. Its bars animate only
     transform and opacity, which the compositor runs on its own thread, so the
     pulse keeps going while the main thread compiles pixi and builds the world.
     Colours are literals mirroring the palette in css/style.css. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0e1b21;
    color: #e8e2d4;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 15, 19, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay-card {
    background: #1a303a;
    border: 1px solid #2c4a58;
    border-radius: 12px;
    padding: 32px 40px;
    max-width: 520px;
    width: calc(100% - 40px);
    text-align: center;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  .loading { padding: 8px 0 4px; }
  .load-mark { font-size: 20px; letter-spacing: 4px; color: #d4a94e; font-weight: bold; }
  .load-mark span { color: #8fa1a8; }
  .load-text { font-size: 16px; }
  .load-bar { display: flex; gap: 6px; justify-content: center; margin: 24px 0 18px; }
  /* each cell is a dark slab with a bright fill cross-fading over it: the fill's
     opacity and the slab's height are the only things that move, so the whole
     pulse is composited and never waits on a busy main thread */
  .load-bar i {
    position: relative;
    width: 22px;
    height: 10px;
    background: #14262f;
    will-change: transform;
    animation: load-lift 1.1s ease-in-out infinite;
  }
  .load-bar i::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #5f93a8;
    opacity: 0.05;
    will-change: opacity;
    animation: load-fade 1.1s ease-in-out infinite;
  }
  .load-bar i:nth-child(2), .load-bar i:nth-child(2)::after { animation-delay: 0.18s; }
  .load-bar i:nth-child(3), .load-bar i:nth-child(3)::after { animation-delay: 0.36s; }
  /* a cell turns brass for good once its stage passes: the first at first paint,
     the second when the scripts arrive, the third when the world is built */
  .load-bar i:nth-child(1),
  .loading.s2 .load-bar i:nth-child(2),
  .loading.s3 .load-bar i:nth-child(3) { background: #8a743f; }
  .load-bar i:nth-child(1)::after,
  .loading.s2 .load-bar i:nth-child(2)::after,
  .loading.s3 .load-bar i:nth-child(3)::after {
    background: #ffd77a;
    box-shadow: 0 0 10px rgba(255, 215, 122, 0.55);
  }
  @keyframes load-lift { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1); } }
  @keyframes load-fade { 0%, 100% { opacity: 0.05; } 50% { opacity: 1; } }
  html[lang="ru"] .loading [lang="en"], html:not([lang="ru"]) .loading [lang="ru"] { display: none; }
</style>
<!-- the rest of the styling is not needed for the card, so it must not hold the
     first paint: it downloads as print media and applies the moment it lands -->
<link rel="stylesheet" href="css/style.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="css/style.css"></noscript>
<script>
  // the loading card below is static markup, painted before the game's scripts
  // arrive; this only picks its language from the saved interface preference
  try {
    if ((localStorage.getItem('mk.uilang') || localStorage.getItem('transsib.uilang')) === 'ru') document.documentElement.lang = 'ru';
  } catch (e) { /* default stands */ }
</script>
</head>
<body>
  <header id="topbar">
    <div id="wordmark">MECHANICAL <span>KEYBOARDING</span></div>
    <div id="topbar-right">
      <div id="session-stats">
        <div class="stat"><span class="stat-value" id="stat-acc">—</span><span class="stat-label" data-i18n="statAccuracy"></span></div>
        <div class="stat"><span class="stat-value" id="stat-wpm">—</span><span class="stat-label" data-i18n="statWpm"></span></div>
        <div class="stat"><span class="stat-value" id="stat-streak">0</span><span class="stat-label" data-i18n="statStreak"></span></div>
        <div class="stat"><span class="stat-value" id="stat-time">0:00</span><span class="stat-label" data-i18n="statToday"></span></div>
      </div>
      <button id="btn-sound" title="sound">🔊</button>
      <button id="btn-settings" title="settings">⚙️</button>
    </div>
  </header>

  <main>
    <section id="playfield">
      <div id="factory">
        <div id="factory-mount"></div>
      </div>
    </section>

    <section id="drill">
      <div id="line-display" tabindex="0"></div>
      <div id="gloss-line">&nbsp;</div>
    </section>

    <section id="keyboard"></section>

  </main>

  <footer>
    <button id="btn-passport" class="link-btn" data-i18n="btnPassport"></button>
    <button id="btn-summary" class="link-btn" data-i18n="btnSummary"></button>
  </footer>

  <!-- overlays. The overlay opens ON the loading card: it is on screen from
       the first paint, before pixi and the game scripts have downloaded, so
       a slow load reads as busy, not frozen. Its three cells light as the
       page paints → the scripts arrive (app.js) → the world is ready; then
       the map picker replaces it. -->
  <div id="overlay">
    <div id="overlay-card">
      <div id="loading" class="loading">
        <div class="load-mark">MECHANICAL <span>KEYBOARDING</span></div>
        <div class="load-bar"><i></i><i></i><i></i></div>
        <p class="load-text">
          <span lang="en">Loading… waking the machines.</span>
          <span lang="ru">Загрузка… машины просыпаются.</span>
        </p>
      </div>
    </div>
  </div>

  <!-- deferred: the parser reaches the end of the document and the loading card
       paints before 800 kB of pixi is compiled. Order is preserved. -->
  <script defer src="libs/pixi.min.js"></script>
  <script defer src="js/flags.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/i18n.js"></script>
  <!-- course data: one physical board, a layout + a course per keyboard -->
  <script defer src="js/board-ansi.js"></script>
  <script defer src="js/language-ru.js"></script>
  <script defer src="js/layout-ru.js"></script>
  <script defer src="js/layout-en.js"></script>
  <script defer src="js/courses.js"></script>
  <script defer src="js/chain.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/pixels.js"></script>
  <script defer src="js/tiles.js"></script>
  <script defer src="js/factory.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
