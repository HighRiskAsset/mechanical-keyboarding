<!doctype html>
<!-- Operator sprite proof (dev only). Every walk beat per direction, the idle
     breath, the work frames, side mirrored, at a machine for scale, and a
     magnified strip for the pixel work. POSTs two PNGs to /upload.
     Open: http://localhost:8123/dev/operator.html -->
<meta charset="utf-8">
<title>operator proof</title>
<style>
  body { margin: 0; background: #12141c; color: #ddd; font: 12px/1.5 monospace; }
  canvas { image-rendering: pixelated; display: block; margin: 8px; }
  #log { padding: 8px; white-space: pre; }
</style>
<div id="log">renderingâ€¦</div>
<canvas id="out"></canvas>
<canvas id="zoom"></canvas>
<script src="gen/pixels.js"></script>
<script src="gen/tiles.js"></script>
<script>
(async function () {
  const log = document.getElementById('log');
  const upload = async (cv, name) => {
    const blob = await (await fetch(cv.toDataURL('image/png'))).blob();
    const res = await fetch('/upload?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    return name + ': ' + res.status + ' ' + await res.text();
  };
  const grass = (x, w, h) => {
    for (let ty = 0; ty < Math.ceil(h / 16); ty++)
      for (let tx = 0; tx < Math.ceil(w / 16); tx++)
        x.drawImage(TILES.fill('grass', (tx * 7 + ty * 13) % 23), tx * 16, ty * 16);
  };
  const put = (x, cv, px, py, flip) => {
    if (!flip) { x.drawImage(cv, px, py); return; }
    x.save(); x.translate(px + cv.width, py); x.scale(-1, 1); x.drawImage(cv, 0, 0); x.restore();
  };
  const upscale = (src, el, k) => {
    el.width = src.width * k; el.height = src.height * k;
    const ox = el.getContext('2d'); ox.imageSmoothingEnabled = false;
    ox.drawImage(src, 0, 0, el.width, el.height);
  };

  // ---------- sheet: every frame, at 5x, on grass ----------
  const W = 400, H = 232;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  grass(x, W, H);
  const label = (s, px, py) => {
    x.fillStyle = 'rgba(10,12,20,0.78)'; x.fillRect(px - 1, py - 6, s.length * 4 + 2, 8);
    x.fillStyle = '#ffffff'; x.font = '6px monospace'; x.fillText(s, px, py);
  };
  const ROW = 32, COL = 22, X0 = 34;
  const rows = [
    ['down', (f) => PIXELS.characterCanvas('down', f), 8, false],
    ['up',   (f) => PIXELS.characterCanvas('up', f),   8, false],
    ['side', (f) => PIXELS.characterCanvas('side', f), 8, false],
    ['sideâ†', (f) => PIXELS.characterCanvas('side', f), 8, true],
    ['idle', (f) => PIXELS.idleCanvas('down', f),      4, false],
    ['work', (f) => PIXELS.workCanvas(f),              4, false],
  ];
  rows.forEach(([name, gen, n, flip], ri) => {
    const py = 4 + ri * ROW;
    label(name, 2, py + 14);
    for (let f = 0; f < n; f++) put(x, gen(f), X0 + f * COL, py, flip);
  });

  // scale check: the operator at a mine and at a manufacturer, docked and not
  const py = 4 + rows.length * ROW;
  label('at scale', 2, py + 14);
  put(x, PIXELS.idleCanvas('down', 0), X0, py);
  put(x, PIXELS.idleCanvas('side', 0), X0 + 24, py);
  x.drawImage(PIXELS.machineCanvas(1, 0), X0 + 60, py - 4);
  put(x, PIXELS.workCanvas(0), X0 + 70, py + 2);
  put(x, PIXELS.characterCanvas('side', 0), X0 + 106, py);
  x.drawImage(PIXELS.machineCanvas(3, 0), X0 + 144, py - 4);
  put(x, PIXELS.characterCanvas('down', 0), X0 + 196, py);
  upscale(c, document.getElementById('out'), 5);

  // ---------- zoom: the key poses at 14x, on grass and on ink ----------
  const poses = [
    PIXELS.idleCanvas('down', 1), PIXELS.idleCanvas('up', 1), PIXELS.idleCanvas('side', 1),
    PIXELS.characterCanvas('side', 0), PIXELS.characterCanvas('side', 4), PIXELS.workCanvas(0),
  ];
  const ZW = poses.length * 24, ZH = 60;
  const z = document.createElement('canvas'); z.width = ZW; z.height = ZH;
  const zx = z.getContext('2d');
  grass(zx, ZW, 30);
  zx.fillStyle = '#12141c'; zx.fillRect(0, 30, ZW, 30);
  poses.forEach((cv, i) => { put(zx, cv, i * 24 + 2, 1); put(zx, cv, i * 24 + 2, 31); });
  upscale(z, document.getElementById('zoom'), 14);

  const q = new URLSearchParams(location.search);
  try {
    const a = await upload(document.getElementById('out'), q.get('name') || 'operator.png');
    const b = await upload(document.getElementById('zoom'), q.get('zoom') || 'operator-zoom.png');
    log.textContent = 'uploaded ' + a + '\nuploaded ' + b;
  } catch (e) { log.textContent = 'upload failed: ' + e; }
})().catch((e) => { document.getElementById('log').textContent = 'ERROR ' + (e.stack || e); });
</script>
