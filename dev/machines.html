<!doctype html>
<!-- Machinery proof sheet (dev only). Every mining-rig frame, every station,
     the depot, belts and pipes, props and the build-menu icons — on the
     grounds they actually stand on, at 4x. POSTs a PNG to /upload.
     Open: http://localhost:8123/dev/machines.html  (optionally ?name=x.png) -->
<meta charset="utf-8">
<title>machinery proof</title>
<style>
  body { margin: 0; background: #1a1a20; color: #ddd; font: 12px/1.4 monospace; }
  #out { image-rendering: pixelated; display: block; margin: 8px; }
  #log { padding: 8px; white-space: pre; }
</style>
<div id="log"></div>
<canvas id="out"></canvas>
<script src="../js/pixels.js"></script>
<script src="../js/tiles.js"></script>
<script src="../js/courses.js"></script>
<script src="../js/language-ru.js"></script>
<script src="../js/maps/kit.js"></script>
<script src="../js/maps/frontier.js"></script>
<script src="../js/maps/range.js"></script>
<script src="../js/chain.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/drops.js"></script>
<script>
(async function () {
  const Q = new URLSearchParams(location.search);
  const SCALE = +(Q.get('s') || 4), W = 320, H = 960;
  const CROP = (Q.get('crop') || '').split(',').map(Number);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const label = (s, px, py) => { x.fillStyle = '#fff4dc'; x.font = '6px monospace'; x.fillText(s, px, py); };
  const bed = (kind, px, py, w, h) => {
    for (let ty = 0; ty < h; ty++) for (let tx = 0; tx < w; tx++) {
      x.drawImage(TILES.fill(kind, (tx * 7 + ty * 13) % 23), px + tx * 16, py + ty * 16);
    }
  };
  x.fillStyle = '#26262e'; x.fillRect(0, 0, W, H);

  // 1. mining rigs: three tiers x four frames, on grass
  bed('grass', 0, 6, 19, 3);
  label('mining rigs — tier 1 / 2 / 3, four frames each', 2, 5);
  [1, 2, 3].forEach((tier, row) => {
    for (let f = 0; f < 4; f++) x.drawImage(PIXELS.machineCanvas(tier, f), 4 + row * 100 + f * 24, 16);
  });

  // 2. stations on their aprons
  const cy2 = 60;
  bed('pad', 0, cy2 + 4, 19, 2);
  label('works, running: smelter · foundry · constructor · molder · fastener · assembler · depot', 2, cy2 + 2);
  ['bigrams', 'foundry', 'words', 'molder', 'fastener', 'lines'].forEach((k, i) => {
    x.drawImage(PIXELS.stationCanvas(k, 0, 'work'), 4 + i * 33, cy2 + 6);
  });
  x.drawImage(PIXELS.pressCanvas(0, 'work'), 204, cy2 + 2);
  x.drawImage(PIXELS.pressCanvas(2, 'work'), 250, cy2 + 2);

  // 3. belts and pipes rolling, on dirt
  const cy3 = 106;
  bed('dirt', 0, cy3 + 4, 19, 2);
  label('belts + pipes: a run that turns, ends, goods aboard — 4 of 8 walk frames', 2, cy3 + 2);
  // a good on the band is the material's own sprite, centred on it
  const HM = PIXELS.MAT_PX >> 1;
  const good = (gx, gy, mat) => x.drawImage(PIXELS.matCanvas(mat), gx - HM, gy - HM);
  const LOAD = ['az', 'buki', 'coal', 'vedi'];
  for (let f = 0; f < 4; f++) {
    const ox = 4 + f * 56, oy = cy3 + 6;
    // a belt run: in from the west, a corner, then north
    x.drawImage(PIXELS.beltTileCanvas(f * 2, 'h', false, false), ox, oy + 16);
    x.drawImage(PIXELS.beltEndCanvas(f * 2, 'w', false), ox, oy + 16);
    x.drawImage(PIXELS.beltTileCanvas(f * 2, 'nw', true, false), ox + 16, oy + 16);
    x.drawImage(PIXELS.beltTileCanvas(f * 2, 'v', true, false), ox + 16, oy);
    x.drawImage(PIXELS.beltEndCanvas(f * 2, 'n', false), ox + 16, oy);
    good(ox + 8, oy + 16 + 8, LOAD[f]);
    good(ox + 16 + 8, oy + 8, LOAD[(f + 2) % 4]);
    // the same turn in copper pipe
    x.drawImage(PIXELS.beltTileCanvas(f * 2, 'h', false, true), ox + 32, oy + 16);
    x.drawImage(PIXELS.beltTileCanvas(f * 2, 'ne', true, true), ox + 48, oy + 16);
    x.drawImage(PIXELS.beltTileCanvas(f * 2, 'v', true, true), ox + 48, oy);
  }

  // 4. props + the operator for scale, on grass
  const cy4 = 148;
  bed('grass', 0, cy4 + 4, 19, 2);
  label('props + operator for scale', 2, cy4 + 2);
  let px = 6;
  for (const k of ['lamppost', 'crate', 'drum', 'sign', 'bush']) {
    const cv = PIXELS.propCanvas(k);
    x.drawImage(cv, px, cy4 + 36 - cv.height); px += cv.width + 8;
  }
  x.drawImage(PIXELS.characterCanvas('side', 0), px + 2, cy4 + 36 - PIXELS.CHAR_H); px += 26;
  x.drawImage(PIXELS.machineCanvas(3, 0), px + 4, cy4 + 0);
  x.drawImage(PIXELS.stationCanvas('bigrams'), px + 36, cy4 + 6);
  x.drawImage(PIXELS.boardCanvas(true), px + 72, cy4 + 0);

  // 5. build-menu icons (12px) + material sprites (10px)
  const cy5 = 194;
  label('kind icons: mine smelter foundry constructor molder assembler fastener crane', 2, cy5);
  ['mine', 'smelter', 'foundry', 'constructor', 'molder', 'assembler', 'fastener', 'crane'].forEach((k, i) => {
    x.drawImage(PIXELS.kindIconCanvas(k), 4 + i * 16, cy5 + 4);
  });
  label('material sprites — the bag and the belt carry the same picture', 2, cy5 + 26);
  ['az', 'vedi', 'coal', 'oil', 'slogi', 'qzbronze', 'slova', 'mold', 'stroki', 'fast', 'crate', 'heavy', 'money'].forEach((k, i) => {
    x.drawImage(PIXELS.matCanvas(k), 4 + i * 16, cy5 + 30);
  });
  label('palette: iron ramp · brass · copper · enamel · soot/steam', 2, cy5 + 54);
  const P = PIXELS.P;
  [P.ironO, P.iron3, P.iron2, P.iron, P.ironL, P.steel, P.brass1, P.brass2, P.brass3,
   P.copper2, P.copper, P.copper3, P.enamD, P.enam, P.enamL, P.soot, P.steam, P.orange, P.glow, P.teal2, P.teal]
    .forEach((col, i) => { x.fillStyle = col; x.fillRect(4 + i * 10, cy5 + 58, 9, 8); });

  // 6. the three states (DESIGN.md 2026-08-20): still holds the pose, idle
  // breathes the lamp only, work drives everything. Told apart at a glance?
  const cy6 = 258;
  bed('pad', 0, cy6 + 4, 19, 5);
  label('three states — still | idle: the lamp breathes | work: the whole machine runs', 2, cy6 + 2);
  const row = (make, py, w) => {
    const put = (cv, px) => x.drawImage(cv, px, py);
    put(make(0, 'still'), 4);
    [0, 1, 3].forEach((f, i) => put(make(f, 'idle'), 4 + (i + 1) * (w + 2) + 6));   // the breath's low, mid, peak
    [0, 1, 2, 3].forEach((f, i) => put(make(f, 'work'), 4 + (i + 4) * (w + 2) + 14));
  };
  row((f, m) => PIXELS.machineCanvas(3, f, m), cy6 + 6, 26);   // the beam-engine rig
  row((f, m) => PIXELS.stationCanvas('lines', f, m), cy6 + 46, 30);  // the assembler

  // 7. facings and ports (rotation overhaul, 2026-08-21): a machine turns
  // rigidly — body, doors and ports together, a clockwise quarter per turn,
  // s → w → n → e — and the footprint turns with it. Verdigris wedges point
  // in, brass out; a door on the sprite sits over the plate it serves in
  // every facing. `tx, ty` is the body box's top-left tile.
  const cy7 = 356;
  bed('grass', 0, cy7 + 4, 20, 37);
  label('facings + ports — the smelter turned s → w → n → e (doors follow their plates)', 2, cy7 + 2);
  const OPPOSITE = { s: 'n', e: 'w', w: 'e', n: 's' };
  const FOOT = (kind) => kind === 'mine' ? 2 : 10;
  const rig = (kind, look, face, tx0, ty0, plug) => {
    const size = CHAIN.KINDS[kind].size;
    const b = MAPKIT.boxAt([tx0, ty0], size, face);
    const ps = SIM.ports({ kind, face });
    for (const q of ps.out.concat(ps.in)) {
      const [tx, ty] = MAPKIT.portTile(b, face, q.side, q.slot);
      x.drawImage(PIXELS.portCanvas(OPPOSITE[q.face], q.dir), tx * 16, ty * 16);
      if (!plug || !plug.includes(q.face + q.slot)) continue;
      // a run leaving straight out of the port, and its drum against the plate
      const vertical = q.face === 's' || q.face === 'n';
      const [ax, ay] = MAPKIT.PORT_AWAY[q.face];
      x.drawImage(PIXELS.beltTileCanvas(0, vertical ? 'v' : 'h', false, false), tx * 16, ty * 16);
      x.drawImage(PIXELS.beltTileCanvas(0, vertical ? 'v' : 'h', false, false), (tx + ax) * 16, (ty + ay) * 16);
      x.drawImage(PIXELS.beltEndCanvas(0, OPPOSITE[q.face], false), tx * 16, ty * 16);
    }
    // the body's box, so the art can be checked against the ground it claims
    x.strokeStyle = 'rgba(255,230,140,0.5)';
    x.strokeRect(b.c0 * 16 + 0.5, b.r0 * 16 + 0.5, b.w * 16 - 1, b.h * 16 - 1);
    const art = look === 'mine' ? PIXELS.machineCanvas(2, 0, 'idle', face) : PIXELS.stationCanvas(look, 0, 'idle', face);
    x.drawImage(art, b.c0 * 16 + ((b.w * 16 - art.width) >> 1), (b.r1 + 1) * 16 - FOOT(kind) - art.height);
    label(kind.slice(0, 4) + ' → ' + face, b.c0 * 16, (b.r1 + 1) * 16 + 22);
  };
  ['s', 'w', 'n', 'e'].forEach((f, i) => rig('smelter', 'bigrams', f, 1 + i * 5, 24));
  label('the mine turned through its four facings — the vein must stay readable', 2, 446);
  ['s', 'w', 'n', 'e'].forEach((f, i) => rig('mine', 'mine', f, 1 + i * 5, 29));
  label('the manufacturer, 3×2: five ports; sideways it stands 2×3', 2, 542);
  ['s', 'w'].forEach((f, i) => rig('manufacturer', 'manufacturer', f, 1 + i * 7, 35, i ? ['w0', 'n0'] : ['s0', 'w1']));
  ['n', 'e'].forEach((f, i) => rig('manufacturer', 'manufacturer', f, 8 + i * 6, 40));
  label('the crane end-on, and the backs of the rest', 2, 764);
  rig('crane', 'crane', 'e', 1, 49);
  [['foundry', 'foundry'], ['words', 'constructor'], ['molder', 'molder']].forEach(([k, kind], i) => rig(kind, k, 'n', 5 + i * 4, 49));
  [['lines', 'assembler'], ['fastener', 'fastener']].forEach(([k, kind], i) => rig(kind, k, 'n', 5 + i * 4, 54));

  const out = document.getElementById('out');
  const [kx, ky, kw, kh] = CROP.length === 4 ? CROP : [0, 0, W, H];
  out.width = kw * SCALE; out.height = kh * SCALE;
  const ox = out.getContext('2d'); ox.imageSmoothingEnabled = false;
  ox.drawImage(c, kx, ky, kw, kh, 0, 0, kw * SCALE, kh * SCALE);
  const name = new URLSearchParams(location.search).get('name') || 'machines.png';
  try {
    const blob = await (await fetch(out.toDataURL('image/png'))).blob();
    const res = await fetch('/upload?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    document.getElementById('log').textContent = 'uploaded ' + name + ': ' + res.status + ' ' + await res.text();
  } catch (e) { document.getElementById('log').textContent = 'upload failed: ' + e; }
})().catch((e) => { document.getElementById('log').textContent = 'ERROR ' + (e.stack || e); });
</script>
