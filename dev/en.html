<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MK · EN course checks</title>
<style>
  body { font: 14px/1.5 Consolas, monospace; background: #14181b; color: #e4ece9; padding: 20px 28px; max-width: 980px; }
  h1 { font-size: 18px; margin: 0 0 6px; } p { color: #9aa9ab; margin: 0 0 14px; }
  .ok { color: #6cc46c; } .fail { color: #ff8a70; }
  li { margin: 2px 0; } .sum { margin-top: 14px; font-weight: bold; }
  pre { color: #9aa9ab; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>The EN QWERTY course — data checks</h1>
<p>Loads js/language-en.js and js/layout-en.js, points chain.js and engine.js at them through a COURSES shim, and asserts a T0 world works with no engine edit (invariant 5). Not linked from the game.</p>
<ul id="out"></ul>
<div class="sum" id="sum"></div>
<pre id="log"></pre>
<script src="../js/i18n.js"></script>
<script src="../js/board-ansi.js"></script>
<script src="../js/layout-en.js"></script>
<script src="../js/language-en.js"></script>
<script>
  // the shim stands in for js/courses.js: the active course is the EN stub
  window.COURSES = {
    get: () => 'en-qwerty',
    active: () => ({ id: 'en-qwerty', ready: true }),
    layout: () => window.LAYOUT_EN,
    course: () => window.LANG_EN,
    saveTag: () => 'en-dryrun.',
    list: () => [], set: () => false,
  };
</script>
<script src="../js/maps/kit.js"></script>
<script src="../js/maps/frontier.js"></script>
<script src="../js/maps/range.js"></script>
<script src="../js/chain.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/drops.js"></script>
<script src="ladder-walk.js"></script>
<script src="ore-load.js"></script>
<script>
(() => {
  const C = window.CHAIN, E = window.ENGINE, L = window.LANG_EN;
  const out = document.getElementById('out'), log = document.getElementById('log');
  let pass = 0, fail = 0;
  const line = (ok, text) => {
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'fail';
    li.textContent = (ok ? '✓ ' : '✗ ') + text;
    out.appendChild(li);
    if (ok) pass++; else fail++;
  };
  try {
    C.useMap('range');
    const p = { pairsUnlocked: 3, letters: {}, seen: {}, bag: {}, machines: [], belts: [], crossings: {}, nextMachineId: 1, unlockLog: [] };
    for (const ch of L.UNLOCK_ORDER) p.letters[ch] = { n: 0, misses: 0, ewErr: 0.5, ewLat: null };
    line(C.unlockedKeys(p).length === 6, `T0 alphabet is the six seed keys (${C.unlockedKeys(p).join(' ')})`);
    const smelts = C.offerableRecipes('smelter', p);
    line(smelts.length >= 1, `the smelter offers ${smelts.length} recipe(s) at T0 (${smelts.map((r) => r.out).join(' ')})`);
    const lineOut = E.generateLine(p, { mode: 'syllables', alphabet: C.unlockedKeys(p), count: 8 });
    const text = lineOut.map((w) => w.text).join(' ');
    line(!!text.length && [...text.replace(/ /g, '')].every((c) => C.unlockedKeys(p).includes(c)), `a T0 syllable line generates inside the alphabet: "${text}"`);
    const np = C.nextPair(p);
    line(!!np && !!C.priceNode(np.ore), `the ladder continues (next: ${np ? np.keys.join(' ') : '—'} at ${np ? np.ore : '?'})`);
    const m = { id: 'm1', kind: 'mine', ore: 'iron', node: 0, auto: false };
    p.machines.push(m); SIM.ensure(p);
    line(SIM.outletsOf(m) === 1, 'the simulation reads the stub world (a mine has one outlet)');
    const words = E.realWordPool(C.unlockedKeys(p).filter((c) => !L.PUNCT.has(c)));
    log.textContent = `word pool at T0: ${words.map(([w]) => w).join(', ') || '(none — syllables carry the tutorial)'}`;
    line(words.length >= 8, `T0 word pool holds real words from the first rung (${words.length}) — u leads the seed alphabet (2026-08-25 ladder)`);
    // the ladder branches (2026-08-22): walk every Mk table the EN course
    // can reach and hold the rules at each — no deadlock (the coal node
    // deadlock of 2026-08-20, a price asking for parts before the 25-word
    // gate could clear, is what this guards against), no kind for sale
    // that cannot name what it waits for, the finger order kept by prices
    const WALK = LADDERWALK.walk(C, L, {
      after: [
        [['coal', 1], ['quartz', 1]],
        [['oil', 1], ['coal', 1]],
        [['fastener', 1], ['oil', 1]],
      ],
    });
    line(WALK.states > 1 && !WALK.deadlocks.length, `the ladder is traversable on every branch: ${WALK.states} reachable states, none deadlocked${WALK.deadlocks.length ? ' — ' + WALK.deadlocks.slice(0, 5).join(' ; ') : ''}`);
    line(!WALK.deadRows.length, `a kind whose price you can pay but which has nothing to make can always name its fix${WALK.deadRows.length ? ' — ' + WALK.deadRows.slice(0, 5).join(' ; ') : ''}`);
    line(!WALK.orderBad.length, `the prices keep the finger order on every branch${WALK.orderBad.length ? ' — ' + WALK.orderBad.slice(0, 5).join(' ; ') : ''}`);
    line(true, `${WALK.lookahead.length} purchases would run two eras ahead (reported, not failed); up to ${WALK.width} rungs for sale at once`);
    log.textContent += WALK.lookahead.length ? '\nlookahead: ' + WALK.lookahead.slice(0, 12).join('\n  ') : '';
    const ladderBad = [];
    for (let i = 3; i < L.PAIRS.length; i++) {
      const prof = { mk: C.mkTable({ pairsUnlocked: i }), letters: {}, seen: {}, bag: {}, machines: [] };
      const ev = L.PAIRS[i];
      for (const m of Object.keys(C.pricePair(ev) || {})) if (!WALK.producible(m, prof)) ladderBad.push(`pair ${i + 1} (${ev.keys.join(' ')}): ${m} not producible`);
    }
    line(!ladderBad.length, `stepping the course order, every price is producible when it appears${ladderBad.length ? ' — ' + ladderBad.join(' ; ') : ''}`);
    // the full-course checks (mirroring dev/verify.html for the RU course)
    const letters = 'abcdefghijklmnopqrstuvwxyz';
    const seenK = {};
    for (const q of L.PAIRS) for (const k of q.keys) seenK[k] = (seenK[k] || 0) + 1;
    const missing = [...letters].filter((c) => !seenK[c]);
    const dupes = Object.entries(seenK).filter(([, n]) => n > 1).map(([k]) => k);
    line(!missing.length && !dupes.length, `pairs cover the 26 letters exactly once${missing.length ? ' — missing ' + missing.join(' ') : ''}${dupes.length ? ' — repeated ' + dupes.join(' ') : ''}`);
    const mkBad = [];
    for (const ore of C.ORE_IDS) { let last = 0; for (const q of L.PAIRS) { if (q.ore !== ore) continue; if (q.mk !== last + 1) mkBad.push(`${ore} mk${q.mk} after mk${last}`); last = q.mk; } }
    line(!mkBad.length, 'ore Mk levels are contiguous and ascending', mkBad.join(' '));
    const LAY = window.LAYOUT_EN;
    const keyBad = L.PAIRS.flatMap((q) => q.keys).filter((k) => !LAY.CHAR_TO_CODE[k]);
    line(!keyBad.length, `every key in the ladder exists on the QWERTY layout${keyBad.length ? ' — missing ' + keyBad.join(' ') : ''}`);
    const allK = new Set(L.PAIRS.flatMap((q) => q.keys));
    const stray = [];
    for (const [s] of [...L.PHRASES, ...L.SENTENCES]) for (const c of s) if (c !== ' ' && !allK.has(c)) stray.push(`${s} — ${c}`);
    for (const [s] of L.PAGES) for (const c of s) if (c !== ' ' && !allK.has(c) && !allK.has(c.toLowerCase())) stray.push(`page: ${c}`);
    line(!stray.length, `phrases (${L.PHRASES.length}), sentences (${L.SENTENCES.length}) and pages (${L.PAGES.length}) use only the course's keys`, stray.slice(0, 8).join('<br>'));
    const wordBad = L.WORDS.filter(([w]) => ![...w].every((c) => allK.has(c))).map(([w]) => w);
    line(!wordBad.length, `all ${L.WORDS.length} words are typeable with the full ladder${wordBad.length ? ' — ' + wordBad.join(' ') : ''}`);
    const wDupes = [...new Set(L.WORDS.map(([w]) => w).filter((w, i, a) => a.indexOf(w) !== i))];
    line(!wDupes.length, `no word appears twice${wDupes.length ? ' — ' + wDupes.join(' ') : ''}`);
    // pool sizes along the ladder (the constructor needs 25 by its opening)
    let alpha = [];
    const stagePools = L.PAIRS.map((q) => { alpha = alpha.concat(q.keys); return E.realWordPool(alpha.filter((c) => !L.PUNCT.has(c))).length; });
    line(stagePools[7] >= 25, `the word pool clears 25 by the Constructor's era (pair 8: ${stagePools[7]})`);
    line(stagePools[L.PAIRS.length - 1] >= 300, `the full pool is deep enough for the late game (${stagePools[L.PAIRS.length - 1]})`);
    log.textContent += `\npool per pair: ${stagePools.join(' ')}`;

    // the vein counts follow the tree (DESIGN.md, ruling 2026-08-25). EN's
    // book is not RU's — the vowel-poor iron alloys are absent — so the ore
    // an EN player leans on is not the ore a RU player does, and each course
    // measures its own maps.
    for (const id of C.MAP_IDS) {
      const veins = ORELOAD.veinsOf(C, id);
      const r = ORELOAD.measure(C, L, veins);
      const owedCut = Object.entries(r.owed).map(([o, n]) => o + ' ' + n).join(' · ');
      if (r.belowFloor.length) {
        line(false, `${id}: every ore owes ${r.floor} veins — short: ${r.belowFloor.join(', ')}`);
      } else if (r.short) {
        line(false, `${id} is short of ${r.short.ore}: one more seam shortens the bill `
          + `${Math.round(r.short.gain * 100)}% (${r.haveTotal} veins, ${r.hours} h)`);
      } else if (r.padded) {
        line(true, `${id} carries a ${r.padded.ore} seam that earns nothing — dropping it costs `
          + `${Math.round(r.padded.cost * 100)}%`);
      } else {
        line(true, `${id}: vein counts follow the tree (${r.haveTotal} veins, bottleneck ${r.hours} h)`);
      }
      log.textContent += `\n${id} ore load: ` + Object.entries(r.perOre)
        .map(([o, v]) => `${o} ${v.veins}v ${v.hours}h ${Math.round(v.busy * 100)}%`).join(' · ')
        + `\n${id} the tree asks for: ${owedCut} (${r.owedTotal} veins, ${r.owedHours} h)`;
    }
  } catch (e) {
    line(false, 'threw: ' + e.message);
  }
  document.getElementById('sum').textContent = `${pass} passed · ${fail} failed`;
})();
</script>
</body>
</html>
