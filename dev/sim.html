<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MK · simulation harness (phase 3)</title>
<style>
  body { font: 14px/1.5 Consolas, monospace; background: #14181b; color: #e4ece9; padding: 20px 28px; max-width: 980px; }
  h1 { font-size: 18px; margin: 0 0 6px; } p { color: #9aa9ab; margin: 0 0 14px; }
  .ok { color: #6cc46c; } .fail { color: #ff8a70; } .warn { color: #f2c14e; }
  li { margin: 2px 0; } .sum { margin-top: 14px; font-weight: bold; }
  pre { color: #9aa9ab; font-size: 12px; }
</style>
</head>
<body>
<h1>Simulation harness — phase 3</h1>
<p>Builds a T1 factory in memory (iron + copper → Smelter · bronze, quartz + Smelter → Foundry · quartz bronze, Foundry → Constructor · parts), runs it headless for 30 simulated minutes in 500 ms steps, and asserts the rules. Not linked from the game.</p>
<ul id="out"></ul>
<div class="sum" id="sum"></div>
<pre id="log"></pre>
<script src="../js/i18n.js"></script>
<script src="../js/board-ansi.js"></script>
<script src="../js/language-ru.js"></script>
<script src="../js/layout-ru.js"></script>
<script src="../js/layout-en.js"></script>
<script src="../js/courses.js"></script>
<script src="../js/maps/kit.js"></script>
<script src="../js/maps/frontier.js"></script>
<script src="../js/maps/range.js"></script>
<script src="../js/chain.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/drops.js"></script>
<script>
(() => {
  const C = window.CHAIN, S = window.SIM;
  const out = document.getElementById('out'), log = document.getElementById('log');
  let pass = 0, fail = 0, warn = 0;
  const line = (ok, text) => {
    const li = document.createElement('li');
    li.className = ok === true ? 'ok' : ok === false ? 'fail' : 'warn';
    li.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : '! ') + text;
    out.appendChild(li);
    if (ok === true) pass++; else if (ok === false) fail++; else warn++;
  };
  C.useMap('range');
  // a T1 save: pairs through с б; letters don't matter to the simulation
  const p = { pairsUnlocked: 6, letters: {}, seen: {}, bag: {}, machines: [], belts: [], crossings: {}, nextMachineId: 1 };
  const add = (m) => { m.id = 'm' + (p.nextMachineId++); p.machines.push(m); S.ensureMachine(m); return m; };
  // ⚙ is per recipe (deep-ore ledger 2026-08-22): a mine's key is the
  // material of its depth, a processor's is out|inputs
  // a T1 save has iron and quartz at Mk2, so those mines yield the DEEP
  // materials — their ⚙ keys are iron2/quartz2, and deep goods ride the belts
  // into the bronze recipe's shallow slots (downward compatibility)
  const iron = add({ kind: 'mine', ore: 'iron', node: 0, autoOn: { iron2: true } });
  const copper = add({ kind: 'mine', ore: 'copper', node: 1, autoOn: { copper: true } });
  const quartz = add({ kind: 'mine', ore: 'quartz', node: 3, autoOn: { quartz2: true } });
  const rkey = (out, inn) => out + '|' + JSON.stringify(inn);
  // seated on tiles, not on sites: the Open Range went free-build on
  // 2026-08-28 and has no `plot` ids left to name. Nothing here reads a
  // position anyway (the belts below are fake paths); these are three
  // clear 2x2 patches of the meadow, and they are here so the harness
  // describes a world that could exist.
  const smelter = add({ kind: 'smelter', at: [10, 10], autoOn: { [rkey('bronze', { iron: 2, copper: 1 })]: true }, recipe: 'bronze', recipeIn: JSON.stringify({ iron: 2, copper: 1 }) });
  const foundry = add({ kind: 'foundry', at: [16, 10], autoOn: { [rkey('qzbronze', { bronze: 2, quartz2: 1 })]: true }, recipe: 'qzbronze', recipeIn: JSON.stringify({ bronze: 2, quartz2: 1 }) });
  const cons = add({ kind: 'constructor', at: [22, 10], autoOn: { [rkey('parts', { qzbronze: 2 })]: true }, recipe: 'parts', recipeIn: JSON.stringify({ qzbronze: 2 }) });
  const fakePath = (n) => Array.from({ length: n }, (_, i) => [i, 0]);
  const link = (a, b, n) => { const ok = S.canLink(p, a, b); if (!ok.ok) { line(false, `canLink ${a.kind}→${b.kind}: ${ok.why}`); return null; } return S.addBelt(p, a, b, fakePath(n)); };
  S.ensure(p);
  link(iron, smelter, 6); link(copper, smelter, 6); link(smelter, foundry, 8); link(quartz, foundry, 6); link(foundry, cons, 8);
  line(p.belts.length === 5, `five belts laid (${p.belts.length})`);
  line(!S.canLink(p, iron, foundry).ok, 'a mine has one outlet — a second belt from the iron mine is refused');
  line(S.canLink(p, smelter, cons).ok === false, 'the smelter cannot feed the constructor (it accepts quartz bronze, not bronze)');

  // run 30 minutes
  const cap = C.TUNING.BUFFER_CAP;
  let worst = 0, negatives = 0, overCap = 0;
  const MIN = 60 * 1000;
  const snapshot = () => ({ parts: cons.buf.out.parts || 0, qzb: foundry.buf.out.qzbronze || 0, bronze: smelter.buf.out.bronze || 0, consIn: cons.buf.in.qzbronze || 0 });
  const check = () => {
    for (const m of p.machines) for (const side of ['in', 'out']) for (const [, n] of Object.entries(m.buf[side])) { if (n < 0) negatives++; if (n > cap) overCap++; worst = Math.max(worst, n); }
  };
  let t = 0;
  const marks = {};
  while (t < 30 * MIN) { S.step(p, 500); t += 500; check(); if (t % (5 * MIN) === 0) marks[t / MIN] = snapshot(); }
  log.textContent = 'snapshots (minute → parts / quartz bronze / bronze in out-buffers):\n' + Object.entries(marks).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join('\n');
  line(negatives === 0, `no buffer ever went negative`);
  line(overCap === 0, `no buffer ever exceeded the cap of ${cap} (worst ${worst})`);
  const parts = cons.buf.out.parts || 0;
  // iron-limited chain: 1 ore / 2 s → 900 iron → 450 bronze → 225 quartz bronze → ~112 parts, minus belt latency
  line(parts >= 70 && parts <= 130, `parts made in 30 min ≈ 112 expected, got ${parts}`);
  line((smelter.buf.out.bronze || 0) < cap, 'the smelter\'s bronze is drained by its belt, not piling to the cap');

  // retool: the iron mine goes back to hand work — the smelter starves, then recovers
  S.collect(p, cons); S.collect(p, foundry); S.collect(p, smelter);   // empty the output buffers (the constructor had hit the cap)
  delete iron.autoOn.iron2;   // the retool: the depth's ⚙ is gone until re-bought
  const before = cons.buf.out.parts || 0;
  for (let k = 0; k < 6 * MIN / 500; k++) S.step(p, 500);
  const st = S.state(p, smelter);
  line(st === 'starved', `after the iron mine retools the smelter starves (state: ${st})`);
  iron.autoOn.iron2 = true;
  for (let k = 0; k < 6 * MIN / 500; k++) S.step(p, 500);
  line((cons.buf.out.parts || 0) > before + 5, `…and recovers when the mine is automated again (+${(cons.buf.out.parts || 0) - before} parts in six minutes)`);

  // hands: a worked machine uses its buffers first, then the bag; output to belt or bag
  p.bag = { iron: 10, copper: 10 };
  smelter.buf.in = { iron: 1, copper: 0 };
  const took = S.takeInput(p, smelter, { iron: 2, copper: 1 });
  line(took && smelter.buf.in.iron === 0 && p.bag.iron === 9 && p.bag.copper === 9, 'takeInput uses the buffer first, then the bag');
  const where1 = S.emit(p, smelter, 'bronze', 1);
  const where2 = S.emit(p, cons, 'parts', 1);
  line(where1.where === 'belt' && where2.where === 'bag' && !where1.spilled && !where2.spilled, 'output rolls onto an exit belt when one exists, else into the bag');
  // the bag cap (2026-08-22): past a full bag the machine's own bin catches
  // it, and only past BOTH does anything come back as a spill
  p.bag.parts = C.TUNING.BAG_CAP;
  cons.buf.out.parts = 0;
  const capped = S.emit(p, cons, 'parts', 5);
  line(capped.spilled === 0 && cons.buf.out.parts === 5 && p.bag.parts === C.TUNING.BAG_CAP, 'a full bag overflows into the machine\'s own bin, not the void');
  cons.buf.out.parts = C.TUNING.BUFFER_CAP;
  const spilled = S.emit(p, cons, 'parts', 3);
  line(spilled.spilled === 3, 'past a full bag AND a full bin, the surplus comes back to be laid on the ground');
  p.bag.parts = 0; cons.buf.out.parts = 0;

  // catch-up equals stepping
  const q = JSON.parse(JSON.stringify(p));
  q.lastTick = 1000; S.catchUp(q, 1000 + 10 * MIN);
  const r = JSON.parse(JSON.stringify(p));
  for (let k = 0; k < 10 * MIN / 500; k++) S.step(r, 500);
  const qc = q.machines.find((m) => m.kind === 'constructor').buf.out.parts || 0, rc = r.machines.find((m) => m.kind === 'constructor').buf.out.parts || 0;
  line(Math.abs(qc - rc) <= 2, `fast-forward matches stepping (${qc} vs ${rc} parts after ten minutes)`);
  // taking a run up: the one door, and the goods it was carrying end up on
  // the ground rather than back in the machine they came from
  const D = window.DROPS;
  const doomed = p.belts[0], riding = doomed.items.length, looseBefore = D.count(p);
  const ironOut = iron.buf.out.iron || 0;
  const razed = D.demolish(p, { belt: doomed });
  line(!!razed && p.belts.length === 4 && !p.belts.includes(doomed), 'a run is taken up through DROPS.demolish (nothing else removes one)');
  line(riding > 0 && D.count(p) - looseBefore === riding && (iron.buf.out.iron || 0) === ironOut,
    `its ${riding} goods fall where they rode, not into the source (${D.count(p) - looseBefore} landed on the ground)`);

  // the lid: the ground holds at most DROPS.MAX stacks, and it folds before
  // it lets go. A resting drop is one with no z, no vz and no settle left,
  // which is what these build by hand.
  const rest = (n, x, y, i) => ({ id: 'x' + i, mat: 'iron', n, x, y });
  const total = (q) => q.drops.reduce((a, d) => a + d.n, 0);
  const heap = { drops: [], nextDropId: 1 };
  for (let i = 0; i < D.MAX + 200; i++) heap.drops.push(rest(1, 8, 8, i));
  D.ensure(heap);
  line(heap.drops.length === 1 && total(heap) === D.MAX + 200,
    `a pile in one tile folds into one stack and keeps its count (${heap.drops.length} stack worth ${total(heap)})`);

  const spread = { drops: [], nextDropId: 1 };
  for (let i = 0; i < D.MAX + 50; i++) spread.drops.push(rest(1, i * 16 + 8, 8, i));
  D.ensure(spread);
  line(spread.drops.length === D.MAX, `stacks that cannot fold are let go oldest first, down to the cap (${spread.drops.length})`);
  line(!spread.drops.some((d) => d.id === 'x0') && spread.drops.some((d) => d.id === 'x' + (D.MAX + 49)),
    'the oldest goes and the newest stays');

  const burst = { drops: [], nextDropId: 1 };
  for (let i = 0; i < D.MAX; i++) burst.drops.push(rest(1, i * 16 + 8, 8, i));
  for (let i = 0; i < 20; i++) D.spawn(burst, 'iron', 1, 40, 40);
  D.ensure(burst);
  const flying = burst.drops.filter((d) => d.z || d.vz || d.settle).length;
  line(burst.drops.length === D.MAX && flying === 20,
    `a burst mid-air is never tidied: all 20 still fly while the cap holds (${flying} in the air, ${burst.drops.length} on the ground)`);

  // ports (rotation overhaul, 2026-08-21): body-relative — the whole front
  // discharges, the right flank fills first — and they turn RIGIDLY: a
  // quarter clockwise per turn, the world side of every port stepping
  // s → w → n → e with the body, slots and all
  const place = (q) => q.face + q.slot;
  const CW = { s: 'w', w: 'n', n: 'e', e: 's' };
  const shortOf = [], shared = [], loose = [];
  for (const kind of Object.keys(C.KINDS)) {
    for (const f of S.FACINGS) {
      const m = { kind, face: f };
      const ps = S.ports(m);
      const all = ps.out.concat(ps.in).map(place);
      if (ps.out.length !== S.outletsOf(m) || ps.in.length !== S.inletsOf(m)) shortOf.push(`${kind} ${f}`);
      if (new Set(all).size !== all.length) shared.push(`${kind} ${f}`);
      const next = S.ports({ kind, face: S.nextFacing(m) });
      const turned = ps.out.concat(ps.in).map((q) => q.dir + q.side + q.slot + CW[q.face]).sort().join();
      const found = next.out.concat(next.in).map((q) => q.dir + q.side + q.slot + q.face).sort().join();
      if (turned !== found) loose.push(`${kind} ${f}`);
    }
  }
  line(!shortOf.length, `every kind's ports are all placed at every facing${shortOf.length ? ' — short at ' + shortOf.join(', ') : ''}`);
  line(!shared.length, `no two ports share a place${shared.length ? ' — ' + shared.join(', ') : ''}`);
  line(!loose.length, `rotation is rigid: a quarter turn carries every port with the body${loose.length ? ' — loose at ' + loose.join(', ') : ''}`);
  const sm = { kind: 'smelter', face: 's' };
  S.turn(sm); S.turn(sm); S.turn(sm); S.turn(sm);
  line(sm.face === 's' && S.facingOf(sm) === 's', 'four turns bring a machine back to facing front');
  const fpM = S.footprintOf({ kind: 'manufacturer', face: 'e' });
  line(fpM[0] === 2 && fpM[1] === 3, `a 3×2 kind turned sideways stands 2×3 (got ${fpM.join('×')})`);

  // sizes: the whole front discharges and the flanks take deliveries, so a
  // kind needs a front of `w` places for its outlets and flanks of `d` for
  // its inlets. This is the rule that decides every size in chain.js —
  // assert it rather than trust it.
  const tooShallow = Object.keys(C.KINDS).filter((k) => {
    const m = { kind: k }, [w, d] = S.sizeOf(m);
    return S.outletsOf(m) > w || S.inletsOf(m) > 2 * d;
  });
  line(!tooShallow.length, `every kind is big enough to seat its ports${tooShallow.length ? ' — too small: ' + tooShallow.join(', ') : ''}`);
  line(S.sizeOf({ kind: 'mine' })[1] === 1 && Object.keys(C.KINDS).every((k) => k === 'mine' || S.sizeOf({ kind: k })[1] > 1),
    'the mine is the one kind one tile deep — it is the one kind with a single outlet');

  document.getElementById('sum').textContent = `${pass} passed · ${fail} failed · ${warn} to look at`;
})();
</script>
</body>
</html>
