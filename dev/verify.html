<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MK · data checks (tech tree v3)</title>
<style>
  body { font: 14px/1.5 Consolas, monospace; background: #14181b; color: #e4ece9; padding: 20px 28px; max-width: 980px; }
  h1 { font-size: 18px; margin: 0 0 6px; } p { color: #9aa9ab; margin: 0 0 14px; }
  .ok { color: #6cc46c; } .fail { color: #ff8a70; } .warn { color: #f2c14e; }
  li { margin: 2px 0; } .sum { margin-top: 14px; font-weight: bold; }
  details { margin: 6px 0 6px 18px; color: #9aa9ab; } summary { cursor: pointer; }
</style>
</head>
<body>
<h1>Data checks — tech tree v3</h1>
<p>Loads the live data files (language-ru, layout-ru, chain, engine) and asserts the rules DESIGN.md states. Not linked from the game.</p>
<ul id="out"></ul>
<div class="sum" id="sum"></div>
<script src="../js/i18n.js"></script>
<script src="../js/board-ansi.js"></script>
<script src="../js/language-ru.js"></script>
<script src="../js/layout-ru.js"></script>
<script src="../js/layout-en.js"></script>
<script src="../js/courses.js"></script>
<script src="../js/maps/kit.js"></script>
<script src="../js/maps/frontier.js"></script>
<script src="../js/maps/range.js"></script>
<script src="../js/chain.js"></script>
<script src="../js/engine.js"></script>
<script>window.SPRITES_BASE = '../assets/sprites/';</script>
<script src="../js/sprites.js"></script>
<script src="../js/tiles.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/drops.js"></script>
<script src="ladder-walk.js"></script>
<script src="ore-load.js"></script>
<script>
(async () => {
  await PIXELS.ready;                       // check 18 bakes real terrain, which needs the sheets
  const L = window.LANG_RU, LAY = window.LAYOUT_RU, C = window.CHAIN, E = window.ENGINE;
  const out = document.getElementById('out');
  let pass = 0, fail = 0, warn = 0;
  const line = (ok, text, detail) => {
    const li = document.createElement('li');
    li.className = ok === true ? 'ok' : ok === false ? 'fail' : 'warn';
    li.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : '! ') + text;
    if (detail) { const d = document.createElement('details'); d.innerHTML = '<summary>details</summary>' + detail; li.appendChild(d); }
    out.appendChild(li);
    if (ok === true) pass++; else if (ok === false) fail++; else warn++;
  };
  const isVowel = (c) => L.VOWELS.has(c);
  const isLetter = (c) => !L.PUNCT.has(c);
  const RU = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';

  // a synthetic profile with every pair of tier ≤ t unlocked
  const profileAt = (t) => {
    let n = 0; while (n < L.PAIRS.length && L.PAIRS[n].tier <= t) n++;
    return { pairsUnlocked: n, letters: {}, seen: {}, machines: [], bag: {} };
  };

  // 1. pairs cover the alphabet exactly once
  const seen = {}; for (const p of L.PAIRS) for (const k of p.keys) seen[k] = (seen[k] || 0) + 1;
  const missing = [...RU].filter((c) => !seen[c]); const dupes = Object.entries(seen).filter(([, n]) => n > 1).map(([k]) => k);
  line(!missing.length && !dupes.length, `pairs cover the 33 letters exactly once${missing.length ? ' — missing ' + missing.join(' ') : ''}${dupes.length ? ' — repeated ' + dupes.join(' ') : ''}`);
  line(seen['.'] === 1, 'the period is introduced once (Oil Mk1)');

  // 2. each mine pair = one finger, both hands
  const bad = [];
  for (const p of L.PAIRS) {
    if (!p.ore || p.keys.length !== 2) continue;
    const f = p.keys.map((k) => LAY.FINGER[LAY.CHAR_TO_CODE[k]]);
    if (!f[0] || !f[1] || f[0].slice(1) !== f[1].slice(1) || f[0][0] === f[1][0]) bad.push(p.keys.join('') + ' → ' + f.join('/'));
  }
  line(!bad.length, 'every two-key mine pair is one finger on both hands', bad.join('<br>'));

  // 3. ore Mk levels contiguous, in order
  const mkBad = [];
  for (const ore of C.ORE_IDS) {
    const mks = L.PAIRS.filter((p) => p.ore === ore).map((p) => p.mk);
    mks.forEach((m, i) => { if (m !== i + 1) mkBad.push(ore + ': ' + mks.join(',')); });
  }
  line(!mkBad.length, 'ore Mk levels are contiguous and ascending', mkBad.join('<br>'));

  // 4. every 2-ore alloy has ≥1 vowel + 1 consonant at its intro tier
  const vcBad = [];
  for (const r of C.RECIPES.filter((x) => x.kind === 'smelter')) {
    const a = C.recipeAlphabet(r, profileAt(r.tier)).filter(isLetter);
    if (!(a.some(isVowel) && a.some((c) => !isVowel(c)))) vcBad.push(r.out + ' @T' + r.tier + ' = ' + a.join(''));
  }
  line(!vcBad.length, 'every smelter alloy holds a vowel and a consonant at its intro tier', vcBad.join('<br>'));

  // 5. every smelter/foundry recipe is offered at its tier (min alphabet, V+C)
  const minBad = [], minInfo = [];
  for (const r of C.RECIPES) {
    const kind = C.KINDS[r.kind];
    if (!kind.ready || r.kind === 'constructor') continue;
    const a = C.recipeAlphabet(r, profileAt(r.tier));
    const ok = C.offerable(r, profileAt(r.tier));
    minInfo.push(`${r.kind} → ${r.out} @T${r.tier}: ${a.length} letters ${ok ? '✓' : '✗'}`);
    if (!ok) minBad.push(`${r.kind} → ${r.out} is not offered at its tier T${r.tier} (${a.length} letters, min ${kind.minAlpha})`);
  }
  line(!minBad.length, 'every smelter and foundry recipe is offered at its tier', (minBad.length ? minBad.join('<br>') + '<br>' : '') + minInfo.join('<br>'));

  // 6. constructor pools: 3-ore alloys must reach 25 words within a tier of
  // arriving; 2-ore alloys may never (vowel-poor ones skip the Constructor
  // by design) — reported, not failed
  const cInfo = [];
  let cFail = false, cWarn = false;
  for (const r of C.RECIPES.filter((x) => x.kind === 'constructor')) {
    const mat = Object.keys(r.in)[0];
    let firstOk = null;
    for (let t = r.tier; t <= 6; t++) {
      if (C.offerable(r, profileAt(t))) { firstOk = t; break; }
    }
    const nAtIntro = C.wordPool(C.recipeAlphabet(r, profileAt(r.tier))).length;
    const three = C.MATS[mat].form === 'ingot3';
    let note = '';
    if (firstOk === null) { note = three ? ' — NEVER offered (3-ore alloy: fix the word list)' : ' — never offered (2-ore alloy: by design)'; if (three) cFail = true; }
    else if (firstOk > r.tier) { note = ` — first offered at T${firstOk}`; if (three && firstOk > r.tier + 1) cFail = true; else if (!three) cWarn = true; }
    cInfo.push(`${mat} → parts: ${nAtIntro} words @T${r.tier}${note}`);
  }
  line(cFail ? false : (cWarn ? null : true), 'constructor recipes: 3-ore alloys offered within a tier of arriving; 2-ore alloys reported', cInfo.join('<br>'));

  // 7. ending families ≥ 6 items, tagged by ore
  const endBad = C.ORE_IDS.filter((o) => !L.ENDINGS[o] || L.ENDINGS[o].length < 6);
  line(!endBad.length, 'every ore has an ending family of ≥ 6 items', endBad.join(', '));

  // 8. syllables use letters only; words have glosses; no duplicate words
  const sylBad = L.SYLLABLES.filter(([s]) => [...s].some((c) => !RU.includes(c))).map(([s]) => s);
  line(!sylBad.length, `syllable table (${L.SYLLABLES.length}) uses letters only`, sylBad.join(' '));
  const noGloss = L.WORDS.filter(([, g]) => !g).map(([w]) => w);
  line(!noGloss.length, `word list (${L.WORDS.length}) — every word has a gloss`, noGloss.join(' '));
  const wDupes = L.WORDS.map(([w]) => w).filter((w, i, a) => a.indexOf(w) !== i);
  line(!wDupes.length, 'no word appears twice', [...new Set(wDupes)].join(' '));
  const cDupes = L.CLUSTERS.filter((c, i, a) => a.indexOf(c) !== i);
  line(!cDupes.length, 'no cluster appears twice', cDupes.join(' '));
  const clBad = L.CLUSTERS.filter((c) => [...c].some((x) => !RU.includes(x) || isVowel(x)));
  line(!clBad.length, `cluster list (${L.CLUSTERS.length}) is consonants only`, clBad.join(' '));

  // 9. the ladder branches (2026-08-22): walk every Mk table the course can
  // reach from the pre-built mines and hold the rules at each. Prices are
  // the only thing that orders one place against another, so the order the
  // course intends — ring finger after middle, pinky after ring, the
  // Fastener's keys after oil — has to fall out of what the prices ask for.
  const WALK = LADDERWALK.walk(C, L, {
    after: [
      [['coal', 1], ['quartz', 1]],       // the seam asks for quartz
      [['oil', 1], ['coal', 1]],        // the derrick asks for a coal alloy
      [['fastener', 1], ['oil', 1]],    // the Fastener's keys need the Fastener, which needs oil
    ],
  });
  line(WALK.states > 1 && !WALK.deadlocks.length, `the ladder is traversable on every branch: ${WALK.states} reachable states, none deadlocked`, WALK.deadlocks.join('<br>'));
  line(!WALK.deadRows.length, 'a kind whose price you can pay but which has nothing to make can always name the upgrade it waits for, or comes alive later on the course', WALK.deadRows.join('<br>'));
  line(WALK.farRows.length ? null : true, `kinds for sale more than four purchases before they have anything to make ("after deeper mines"): ${WALK.farRows.length} state·kind pairs`, WALK.farRows.slice(0, 12).join('<br>'));
  line(!WALK.orderBad.length, 'the prices keep the finger order: coal after quartz, oil after coal, the Fastener\'s keys after oil — on every branch', WALK.orderBad.join('<br>'));
  line(WALK.lookahead.length ? null : true, `no rung goes on sale two eras ahead of the lowest one still unbought${WALK.lookahead.length ? ' — ' + WALK.lookahead.length + ' to look at' : ''}`, WALK.lookahead.slice(0, 20).join('<br>'));
  line(WALK.width >= 2, `the ladder branches: up to ${WALK.width} rungs for sale and producible at once (at ${WALK.widthAt})`);
  // the course order is one of the branches: stepping the rungs in file
  // order, every price is producible when its rung appears
  const priceBad = [];
  for (let i = 3; i < L.PAIRS.length; i++) {
    const prof = { pairsUnlocked: i, letters: {}, seen: {}, bag: {}, machines: [] };
    const ev = L.PAIRS[i];
    const price = C.pricePair(ev);
    for (const m of Object.keys(price || {})) if (!WALK.producible(m, { mk: C.mkTable(prof), letters: {}, seen: {}, bag: {}, machines: [] })) priceBad.push(`pair ${i + 1} (${ev.keys.join(' ')}): ${m} not producible`);
  }
  line(!priceBad.length, 'stepping the course order, every price is producible when its rung appears', priceBad.join('<br>'));

  // 10. arity matches recipe inputs
  const arBad = C.RECIPES.filter((r) => Object.keys(r.in).length !== C.KINDS[r.kind].arity).map((r) => `${r.kind} → ${r.out}: ${Object.keys(r.in).length} inputs, arity ${C.KINDS[r.kind].arity}`);
  line(!arBad.length, 'recipe input counts match their kind\'s arity', arBad.join('<br>'));

  // 11. every ore has a node on every map; T0 ores have a starter node
  const nodeBad = [];
  for (const id of C.MAP_IDS) {
    const m = C.MAPS[id];
    for (const ore of C.ORE_IDS) {
      const has = m.MAP.NODES.some((n) => C.ORE_BY_NODE[n.kind] === ore);
      if (!has) nodeBad.push(`${id}: no ${ore} node`);
    }
  }
  line(!nodeBad.length, 'every map has a node for every ore', nodeBad.join('<br>'));

  // 11b. the vein counts follow the tree (DESIGN.md, ruling 2026-08-25): an
  // ore's veins are owed in proportion to the work that ore is asked to do,
  // and the test is local optimality — no single-vein swap may shorten the
  // bill by more than the margin. Recomputed here, never written down.
  for (const id of C.MAP_IDS) {
    const veins = ORELOAD.veinsOf(C, id);
    const r = ORELOAD.measure(C, L, veins);
    const table = '<table>' + Object.entries(r.perOre).map(([o, v]) =>
      `<tr><td>${o}</td><td>${v.veins} vein${v.veins === 1 ? '' : 's'}</td>` +
      `<td>${v.units} ore</td><td>${v.hours} h</td><td>${Math.round(v.busy * 100)}% busy</td></tr>`).join('') + '</table>';
    const owedCut = Object.entries(r.owed).map(([o, n]) => o + ' ' + n).join(' · ');
    const detail = table + `<br>the tree asks for: <b>${owedCut}</b> (${r.owedTotal} veins, bottleneck ${r.owedHours} h)`
      + `<br>growth from the floor: ${r.steps.join(' · ') || '(none — the floor already covers it)'}`;
    if (r.belowFloor.length) {
      line(false, `${id}: every ore owes ${r.floor} veins (an extra-mine row to sell) — short: ${r.belowFloor.join(', ')}`, detail);
    } else if (r.short) {
      line(false, `${id} is short of ${r.short.ore}: one more seam of it shortens the bill `
        + `${Math.round(r.short.gain * 100)}% (${r.haveTotal} veins, ${r.hours} h)`, detail);
    } else if (r.padded) {
      line(null, `${id} carries a ${r.padded.ore} seam that earns nothing: dropping it costs `
        + `${Math.round(r.padded.cost * 100)}% (${r.haveTotal} veins, ${r.hours} h)`, detail);
    } else {
      line(true, `${id}: vein counts follow the tree (${r.haveTotal} veins, bottleneck ${r.hours} h) — `
        + `no seam gains > ${Math.round(r.margin * 100)}%, none is idle`, detail);
    }
  }

  // 12. the engine knows no Cyrillic
  try {
    const src = await (await fetch('../js/engine.js')).text();
    const cyr = src.match(/[Ѐ-ӿ]+/g) || [];
    line(!cyr.length, 'engine.js contains no Cyrillic literal (invariant 5)', cyr.join(' '));
  } catch (e) { line(null, 'engine.js source could not be fetched (open through the dev server)'); }

  // 13. tier bars ascend
  let barsOk = true;
  for (let i = 1; i < C.BARS.length; i++) if (C.BARS[i].wpm < C.BARS[i - 1].wpm || C.BARS[i].acc < C.BARS[i - 1].acc) barsOk = false;
  line(barsOk, 'tier bars ascend');

  // ---- phase 4: the T2–T3 grammars' pools, and the map ----
  const ladder = [];
  { let a = []; for (const p of L.PAIRS) { a = a.concat(p.keys); ladder.push(a.slice()); } }
  const lettersOf = (a) => a.filter((c) => !L.PUNCT.has(c));
  // 14. every phrase and sentence is typeable with the course's keys
  const allKeys = new Set(L.PAIRS.flatMap((p) => p.keys));
  const strayChars = [];
  for (const [s] of [...(L.PHRASES || []), ...(L.SENTENCES || [])]) for (const c of s) if (c !== ' ' && !allKeys.has(c)) strayChars.push(`${s} — ${c}`);
  line(!strayChars.length, `phrases (${(L.PHRASES || []).length}) and sentences (${(L.SENTENCES || []).length}) use only the course's keys`, strayChars.slice(0, 10).join('<br>'));
  // 15. the Assembler has phrases when it opens (18 keys), the Fastener sentences (20–21)
  const at = (n) => ladder.find((a) => a.length >= n) || ladder[ladder.length - 1];
  const ph18 = E.phrasePool(at(C.KINDS.assembler.minAlpha)).length, se20 = E.sentencePool(at(20)).length, se21 = E.sentencePool(at(21)).length;
  line(ph18 >= 30, `phrase pool at ${C.KINDS.assembler.minAlpha} keys ≥ 30 (${ph18})`);
  line(se20 >= 60 && se21 >= 100, `sentence pool at 20 keys ≥ 60 (${se20}), at 21 ≥ 100 (${se21})`);
  // 16. every ending family has an affix the Molder can use at 14 keys, and a real pool by 18
  const famBad = [];
  for (const ore of Object.keys(L.ENDINGS)) {
    const a14 = lettersOf(at(14)), a18 = lettersOf(at(18));
    const aff14 = L.ENDINGS[ore].some((x) => [...x.replace(/-/g, '')].every((c) => a14.includes(c)));
    const pool18 = E.endingPool(a18, ore).length;
    if (!aff14 && ore !== 'oil') famBad.push(`${ore}: no affix at 14 keys`);
    if (pool18 < 5 && ore !== 'oil') famBad.push(`${ore}: ${pool18} words at 18 keys`);
  }
  line(!famBad.length, 'ending families: an affix by 14 keys, words by 18 (oil family waits for its ore)', famBad.join('<br>'));
  // 17. word list size
  line(L.WORDS.length >= 1000, `word list ≥ 1000 (${L.WORDS.length})`);
  // 17b. names are capitalized and typeable; pages use only the course's keys
  const capBad = (L.NAMES || []).filter(([w]) => w[0] !== w[0].toUpperCase() || ![...w.toLowerCase()].every((c) => allKeys.has(c))).map(([w]) => w);
  line((L.NAMES || []).length >= 20 && !capBad.length, `names (${(L.NAMES || []).length}): capitalized, letters on the course's keys`, capBad.join(' '));
  const pageBad = [];
  for (const [s] of (L.PAGES || [])) for (const c of s) if (c !== ' ' && !allKeys.has(c) && !allKeys.has(c.toLowerCase())) pageBad.push(`${c} in "${s.slice(0, 40)}…"`);
  line((L.PAGES || []).length >= 10 && !pageBad.length, `pages (${(L.PAGES || []).length}): every character on the course's keys (capitals fold)`, pageBad.slice(0, 8).join('<br>'));
  // 17c. the crane and manufacturer offer their recipes at full alphabet
  const full = { pairsUnlocked: L.PAIRS.length, letters: {}, seen: {}, bag: {}, machines: [] };
  line(C.offerableRecipes('crane', full).length >= 1 && C.offerableRecipes('manufacturer', full).length >= 1, 'the Crane and the Manufacturer offer recipes at the full alphabet');
  // 17d. no automation price asks for heavy modules (the finish counter);
  // every ⚙ side-good exists in the course's book
  const autoBad = [];
  for (const [kind, spec] of Object.entries(C.PRICES.auto)) {
    if (spec.plus && spec.plus.heavy) autoBad.push(kind + ': heavy');
    for (const mat of Object.keys(spec.plus || {})) {
      const inBook = C.MATS[mat].form !== 'ingot' && C.MATS[mat].form !== 'ingot3' ? true : C.bookRecipes().some((r) => r.out === mat);
      if (!inBook) autoBad.push(kind + ': ' + mat + ' not in this course\'s book');
    }
  }
  line(!autoBad.length, 'automation prices: never heavy modules, and every side-good is in the course\'s book', autoBad.join('<br>'));
  // 17e. the bag cap: no single-material ask (paced) may crowd what the
  // operator can hold — every price fits with ≥20% headroom
  {
    const asks = [];
    const take = (label, cost) => { for (const [mat, n] of Object.entries(cost || {})) asks.push([label + ' · ' + mat, n]); };
    for (const [ore, pr] of Object.entries(C.PRICES.node)) take('node ' + ore, C.priceNode(ore));
    for (const ore of Object.keys(C.PRICES.mk)) for (const lvl of Object.keys(C.PRICES.mk[ore])) take(ore + ' Mk' + lvl, C.priceMk(ore, +lvl));
    for (const kind of Object.keys(C.PRICES.at)) for (const lvl of Object.keys(C.PRICES.at[kind])) take(kind + ' Mk' + lvl, C.priceAt(kind, +lvl));
    for (const kind of Object.keys(C.PRICES.machine)) take('build ' + kind, C.priceMachine(kind, 1));
    for (const ore of C.ORE_IDS) { take('extra mine ' + ore, C.priceExtraMine(ore)); take('mine ⚙ ' + ore, C.priceAuto({ kind: 'mine', ore }, null, null)); }
    for (const [kind, spec] of Object.entries(C.PRICES.auto)) take('⚙ ' + kind, C.scaleCost(Object.assign({ own: spec.own }, spec.plus), C.TUNING.PACE));
    const cap = C.TUNING.BAG_CAP;
    const over = asks.filter(([, n]) => n > cap * 0.8);
    line(!over.length, `no single-material ask crowds the bag: every hold ≤ ${cap * 0.8} of the ${cap} cap`, over.map(([l, n]) => `${l}: ${n}`).join('<br>'));
  }
  // 18. every site and node stands on clear ground and is reachable from the spawn (crossings counted open)
  const placeBad = [], placePending = [];
  for (const mapId of C.MAP_IDS) {
    C.useMap(mapId);
    const map = C.MAPS[mapId];
    const W = map.W, H = map.H;
    const grid = TILES.bake(C.MAP, W, H);
    const spots = [...C.SITES.map((p) => ({ id: p.id, kind: 'site', x: p.x, y: p.y })), ...C.MAP.NODES.filter((nd) => C.ORE_BY_NODE[nd.kind]).map((nd, i) => ({ id: nd.kind + '#' + i, kind: 'vein', x: nd.x + 4, y: nd.y + 12, node: nd }))];
    const cross = C.MAP.CROSSINGS.map((cr) => ({ x: cr.x, y: cr.y, w: cr.w, h: cr.h }));
    const inRect = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
    const solidAt = (x, y) => { const tl = TILES.tileAt(grid, x, y); return tl === null || !!(grid.flags[tl] & TILES.FL.SOLID); };
    const wallAt = (x, y) => (C.MAP.WALLS || []).some((r) => inRect(r, x, y));
    const sceneryAt = (x, y) => C.SCENERY.some((sc) => { const b = sc.box; return x > b.x - 3 && x < b.x + b.w + 3 && y > b.y - 3 && y < b.y + b.h + 3; });
    const step = 4, sp = [Math.round(map.spawn.x / step) * step, Math.round(map.spawn.y / step) * step];
    const key = (x, y) => (x / step) + ',' + (y / step);
    const seenT = new Set([key(...sp)]); const q = [sp]; let guard = 0;
    while (q.length && guard++ < 400000) {
      const [x, y] = q.shift();
      for (const [dx, dy] of [[step, 0], [-step, 0], [0, step], [0, -step]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const k = key(nx, ny); if (seenT.has(k)) continue;
        const ok = cross.some((r) => inRect(r, nx, ny)) || (!wallAt(nx, ny) && !sceneryAt(nx, ny) && TILES.passable(grid, x, y, nx, ny));
        if (!ok) continue;
        seenT.add(k); q.push([nx, ny]);
      }
    }
    const near = (x, y) => { for (let dx = -8; dx <= 8; dx += 4) for (let dy = -8; dy <= 8; dy += 4) if (seenT.has(key(Math.round((x + dx) / step) * step, Math.round((y + dy) / step) * step))) return true; return false; };
    // What a spot has to hold (rotation overhaul, 2026-08-21): a build site
    // is 3×3 and takes the largest kind at EVERY facing — the four-facing
    // guarantee (ruling 2026-08-20) — a vein takes a mine at every facing.
    // Checked on the real geometry: the seated boxes CHAIN hands factory.js
    // and the body-relative places sim.js hangs off them. Both maps were
    // re-laid to the guarantee in the 2026-08-21 map rework, so a facing
    // shortfall is a FAILURE now, not a worklist entry — a site that cannot
    // take every facing is a site the build ghost will refuse you at, and
    // that is a thing to fix in the map file, not to live with.
    const biggest = C.KIND_IDS.filter((k) => k !== 'mine')
      .reduce((a, b) => (C.KINDS[b].size[0] * C.KINDS[b].size[1] > C.KINDS[a].size[0] * C.KINDS[a].size[1] ? b : a));
    const sites = spots.map((s) => s.kind === 'site' ? MAPKIT.siteBox({ x: s.x, y: s.y }) : MAPKIT.veinBox(s.node));
    const taken = new Set();
    sites.forEach((b) => { for (let ty = b.r0; ty <= b.r1; ty++) for (let tx = b.c0; tx <= b.c1; tx++) taken.add(tx + ',' + ty); });
    const tileFree = (tx, ty, own, body) => {
      const cx = tx * 16 + 8, cy = ty * 16 + 8;
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) return false;
      if (solidAt(cx, cy) || wallAt(cx, cy) || sceneryAt(cx, cy)) return false;
      if (body && body.has(tx + ',' + ty)) return false;
      const k = tx + ',' + ty;
      return !taken.has(k) || (own && own.has(k));
    };
    const stepFree = (ax, ay, bx, by) => TILES.passable(grid, ax * 16 + 8, ay * 16 + 8, bx * 16 + 8, by * 16 + 8);
    spots.forEach((s, i) => {
      const issues = new Set(), pending = new Set();
      const site = sites[i], own = new Set();
      for (let ty = site.r0; ty <= site.r1; ty++) for (let tx = site.c0; tx <= site.c1; tx++) own.add(tx + ',' + ty);
      for (let ty = site.r0; ty <= site.r1; ty++) for (let tx = site.c0; tx <= site.c1; tx++) {
        const cx = tx * 16 + 8, cy = ty * 16 + 8;
        if (solidAt(cx, cy)) pending.add('solid ground on the site');
        if (wallAt(cx, cy)) pending.add('wall on the site');
        if (sceneryAt(cx, cy)) pending.add('scenery on the site');
        if (taken.has(tx + ',' + ty) && !own.has(tx + ',' + ty)) pending.add('site over a neighbour');
      }
      // a facing is legal when SOME seat of the body inside the site leaves
      // every port's tile and its way out usable — and a run has to be able
      // to STEP between the two: a belt cannot climb a cliff any more than
      // a walker can (factory.js beltStep), so a port whose way out is the
      // drop off a plateau is no port at all
      const kind = s.kind === 'vein' ? 'mine' : biggest;
      const size = C.KINDS[kind].size;
      const faces = [];
      for (const f of MAPKIT.FACINGS) {
        const fp = MAPKIT.footprint(size, f);
        let ok = false;
        for (let oc = 0; !ok && oc + fp[0] <= site.c1 - site.c0 + 1; oc++) {
          for (let orr = 0; !ok && orr + fp[1] <= site.r1 - site.r0 + 1; orr++) {
            const b = MAPKIT.boxAt([site.c0 + oc, site.r0 + orr], size, f);
            const body = new Set();
            for (let ty = b.r0; ty <= b.r1; ty++) for (let tx = b.c0; tx <= b.c1; tx++) body.add(tx + ',' + ty);
            const ps = SIM.ports({ kind, face: f });
            ok = ps.out.concat(ps.in).every((q) => {
              const [tx, ty] = MAPKIT.portTile(b, f, q.side, q.slot);
              const [dx, dy] = MAPKIT.PORT_AWAY[q.face];
              return tileFree(tx, ty, own, body) && tileFree(tx + dx, ty + dy, own, body) && stepFree(tx, ty, tx + dx, ty + dy);
            });
          }
        }
        // a vein is smaller than the mine's turned box: let the body hang a
        // row over its edges the way the build ghost allows
        if (!ok && s.kind === 'vein') {
          for (let oc = -1; !ok && oc <= 1; oc++) for (let orr = -1; !ok && orr <= 1; orr++) {
            const b = MAPKIT.boxAt([site.c0 + oc, site.r0 + orr], size, f);
            if (b.c1 < site.c0 || b.c0 > site.c1 || b.r1 < site.r0 || b.r0 > site.r1) continue;
            const body = new Set();
            for (let ty = b.r0; ty <= b.r1; ty++) for (let tx = b.c0; tx <= b.c1; tx++) body.add(tx + ',' + ty);
            const ps = SIM.ports({ kind, face: f });
            ok = ps.out.concat(ps.in).every((q) => {
              const [tx, ty] = MAPKIT.portTile(b, f, q.side, q.slot);
              const [dx, dy] = MAPKIT.PORT_AWAY[q.face];
              return tileFree(tx, ty, own, body) && tileFree(tx + dx, ty + dy, own, body) && stepFree(tx, ty, tx + dx, ty + dy);
            });
          }
        }
        if (ok) faces.push(f);
      }
      if (!faces.length) issues.add(`no facing seats a ${kind}`);
      else if (faces.length < 4) pending.add(`${faces.length} of 4 facings (${faces.join(' ')})`);
      const mid = s.x + ((size[0] * 16 - 2) >> 1);
      if (solidAt(mid, s.y + 6)) issues.add('dock on solid');
      if (!near(mid, s.y + 6)) issues.add('unreachable');
      if (issues.size) placeBad.push(`${mapId} ${s.id} @${s.x},${s.y}: ${[...issues].join(' · ')}`);
      if (pending.size) placePending.push(`${mapId} ${s.id} @${s.x},${s.y}: ${[...pending].join(' · ')}`);
    });
  }
  C.useMap(C.DEFAULT_MAP);
  line(!placeBad.length, 'every site and vein can take its machine somehow, on reachable ground', placeBad.join('<br>'));
  line(!placePending.length,
    `the four-facing guarantee (3×3 sites, every facing legal)${placePending.length ? ' — ' + placePending.length + ' spots short' : ' holds on every site and vein of every map'}`,
    placePending.join('<br>'));

  document.getElementById('sum').textContent = `${pass} passed · ${fail} failed · ${warn} to look at`;
})();
</script>
