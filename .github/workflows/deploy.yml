# Publishes the game to Hostinger on every push to main, over SFTP.
#
# One-time setup, all on github.com:
#
#   Settings -> Secrets and variables -> Actions -> "Secrets" tab
#     SSH_USER         the Hostinger SSH username, e.g. u123456789
#                      (hPanel -> Advanced -> SSH Access)
#     SSH_PRIVATE_KEY  the whole private key file, BEGIN and END lines included
#
#   Nothing else. The upload path was a repository variable once and is written
#   out below instead: a variable is exactly the thing that gets left pointing
#   at last year's domain, and it points there silently.
#
# The matching public key goes in hPanel -> Advanced -> SSH Access -> Add key.
#
# Not FTP. The FTP service on this host presents a certificate for *.hstgr.io
# only, so it cannot be verified against this domain — the choice was to stop
# checking the server's identity or to stop using FTP, and this is the latter.

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. If two pushes land together the older run is dropped
# rather than racing the newer one onto the server half-uploaded.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

env:
  SSH_HOST: mechanical-keyboarding.foxforger.com
  SSH_PORT: '65002'
  # Spelled out rather than read from settings. The path is only a domain name,
  # so keeping it off in a repository variable hid nothing — while a variable
  # still naming a retired domain sends a green build into a directory nothing
  # serves. Moving the site is now one commit, and it is this line.
  REMOTE_DIR: domains/mechanical-keyboarding.foxforger.com/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo is not the site. Design notes, the dev/ scratch pages and the
      # local PowerShell server stay behind; only what the game loads ships.
      - name: Stage the site
        run: |
          set -eu
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -r css js libs _site/
          # Baked art, named folder by folder rather than `cp -r assets`: the
          # working copy also holds assets/inbox and assets/ref, which are
          # gitignored scratch and reference and have no business on the site.
          mkdir -p _site/assets
          cp -r assets/maps _site/assets/
          # The sprite sheets + manifests the game renders from (js/sprites.js)
          cp -r assets/sprites _site/assets/
          cp deploy/htaccess _site/.htaccess
          echo "--- staged for upload ---"
          find _site -type f | sort
          du -sh _site

      # Each question the deploy depends on gets its own step. A build log here
      # is readable only with admin rights, but step names and their pass/fail
      # are public, so the first step that goes red names the fault by itself.

      - name: Probe 1 - the deploy key arrived intact
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_PRIVATE_KEY is empty: never saved, or the name is not an"
            echo "exact match. It must be SSH_PRIVATE_KEY, in caps."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # printf, not echo: the key is only valid with its trailing newline,
          # and pasting into a web form is exactly where that gets lost.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Deriving the public half proves the private key parses. A key mangled
          # in transit fails here, plainly, rather than as "permission denied"
          # three steps later where it reads like the wrong key.
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub \
            || { echo "The key did not parse. Copy the file whole, from the"; \
                 echo "BEGIN line to the END line, and keep the line breaks."; exit 1; }
          echo "Key parses. Public half:"
          cat ~/.ssh/deploy_key.pub

      - name: Probe 2 - the SSH port accepts a connection
        run: |
          set -eu
          # Connect and stop there. An earlier version read the banner with
          # head -c 60, which blocks: the greeting is 19 bytes and the rest
          # never comes, so a reachable port timed out and read as unreachable.
          timeout 15 bash -c "exec 3<>/dev/tcp/$SSH_HOST/$SSH_PORT" \
            || { echo "cannot reach $SSH_HOST on port $SSH_PORT"; exit 1; }
          echo "port $SSH_PORT is reachable"

      - name: Probe 3 - the host key matches the pin
        run: |
          set -eu
          # Pinned from the server on 2026-08-20 and re-checked against the
          # foxforger.com hostname on 2026-08-23, unchanged: the site moved
          # domains, not machines. If Hostinger moves the account to another
          # machine this step goes red, which is correct: a deploy that re-pins
          # whatever answers the port is not pinned at all.
          # Re-pin with: ssh-keyscan -p 65002 -t ed25519 <host>
          PIN='AAAAC3NzaC1lZDI1NTE5AAAAIEBHZ2ZU+Yu9F0YBxaZwkWLM5WNIEiAvzv8zBrxpiA1R'
          {
            echo "[$SSH_HOST]:$SSH_PORT ssh-ed25519 $PIN"
            echo "[195.179.237.172]:$SSH_PORT ssh-ed25519 $PIN"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          live=$(ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" 2>/dev/null | awk '{print $3}' | head -1)
          [ -n "$live" ] || { echo "The server offered no ed25519 host key."; exit 1; }
          [ "$live" = "$PIN" ] || {
            echo "HOST KEY MISMATCH — the server is not the one this was pinned to."
            echo "Expected: $PIN"
            echo "Offered:  $live"
            echo "If Hostinger migrated the account this is expected; re-pin above."
            echo "If not, do not deploy: something is answering in its place."
            exit 1
          }
          echo "Host key matches the pin."

      - name: Probe 4 - the key authenticates and REMOTE_DIR exists
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu
          # Batch sftp rather than a shell command: it works even where the
          # account is confined to the SFTP subsystem with no shell of its own.
          printf 'cd %s\npwd\nls -1\n' "$REMOTE_DIR" | sftp -b - \
            -i $HOME/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST"

      - name: Upload over SFTP
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu
          # A generated batch script, not a sync tool. openssh-client is already
          # on the runner, while installing lftp spent 17 seconds of a 29 second
          # deploy to do work that twenty-one puts over one already-open
          # connection finish in three.
          #
          # mkdir lines carry a leading '-' so an existing directory is not an
          # error. put lines are bare, so a failed upload still stops the run.
          B="$RUNNER_TEMP/deploy.sftp"
          {
            echo "cd $REMOTE_DIR"
            (cd _site && find . -mindepth 1 -type d -printf '%P\n' | sort) |
              while read -r d; do echo "-mkdir $d"; done
            (cd _site && find . -type f -printf '%P\n' | sort) |
              while read -r f; do echo "put _site/$f $f"; done
          } > "$B"
          echo "--- batch ---"
          cat "$B"
          sftp -b "$B" \
            -i $HOME/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST"
          echo "uploaded $(grep -c '^put ' "$B") files"

# The batch uploads and overwrites; it never removes. A file dropped from the
# site outlives the deploy that dropped it, until someone deletes it by hand.
# Pruning would mean generating rm lines against a remote listing, and that is
# worth the care rather than the convenience: this account also carries several
# other sites, and a REMOTE_DIR aimed one level too high would reach them.
