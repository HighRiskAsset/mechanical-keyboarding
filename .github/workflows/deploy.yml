# Publishes the game to Hostinger on every push to main.
#
# One-time setup, all on github.com (nothing here needs a local install):
#
#   Settings -> Secrets and variables -> Actions -> "Secrets" tab -> New secret
#     FTP_HOST      ftp.yourdomain.com   (hPanel -> Files -> FTP Accounts, "FTP hostname")
#     FTP_USER      u123456789.yourdomain.com
#     FTP_PASSWORD  the FTP account password
#
#   ...same page -> "Variables" tab -> New variable
#     FTP_REMOTE_DIR  where the site lives on the host, e.g.
#                       public_html            -> yourdomain.com
#                       public_html/keyboard   -> yourdomain.com/keyboard
#                       domains/demo.yourdomain.com/public_html -> a subdomain
#
# Deploys are additive: files are uploaded and overwritten, never deleted. See
# the note on --delete at the bottom before turning pruning on.

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. If two pushes land together the older run is dropped
# rather than racing the newer one onto the server half-uploaded.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    # Dormant until the FTP settings exist, so the workflow can land on main
    # without failing every push until you have added them.
    if: vars.FTP_REMOTE_DIR != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo is not the site. Design notes, the dev/ scratch pages and the
      # local PowerShell server stay behind; only what the game loads ships.
      - name: Stage the site
        run: |
          set -eu
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -r css js libs _site/
          # Phase 6 bakes the art to PNG under assets/ — add `cp -r assets _site/`
          # here when that lands, or the remastered sprites will not ship.
          cp deploy/htaccess _site/.htaccess
          echo "--- staged for upload ---"
          find _site -type f | sort
          du -sh _site

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # The connection is probed one layer at a time, each in its own step, on
      # purpose: a build log on this repo is readable only with admin rights,
      # but step names and their pass/fail are public. So the first step that
      # goes red names the fault, with nobody needing to open a log.
      #
      # None of these carries a secret into the output, and none retries a bad
      # password — a host's brute-force guard should never see this coming.

      - name: Probe 1a - the FTP_HOST secret is present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "${FTP_HOST:-}" ]; then
            echo "FTP_HOST came through empty. Either the secret was never saved,"
            echo "or its name is not an exact match — it must be FTP_HOST, caps."
            exit 1
          fi
          echo "FTP_HOST is set: ${#FTP_HOST} characters."

      - name: Probe 1b - FTP_HOST is a bare hostname
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          # The commonest way this field goes wrong is pasting what hPanel shows
          # on screen rather than the host part of it.
          case "$FTP_HOST" in
            *://*) echo "It carries a scheme (ftp://...). Use the bare host."; exit 1 ;;
            */*)   echo "It carries a slash. Use the bare host, with no path."; exit 1 ;;
            *\ *)  echo "It contains a space."; exit 1 ;;
          esac
          echo "Shape looks like a bare hostname."

      - name: Probe 1c - the hostname resolves
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          getent hosts "$FTP_HOST" && exit 0
          echo "A plausible hostname, but DNS has no record for it."
          echo "hPanel -> Files -> FTP Accounts shows the FTP hostname; if the"
          echo "domain does not point at Hostinger yet, use the server IP there."
          exit 1

      - name: Probe 2 - port 21 accepts a connection
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: timeout 15 bash -c "exec 3<>/dev/tcp/$FTP_HOST/21 && head -c 120 <&3"

      - name: Probe 3 - FTPS handshake, certificate valid for this host
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          set -eu
          out=$(timeout 20 openssl s_client -connect "$FTP_HOST:21" -starttls ftp -brief </dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Verification: OK" \
            || { echo "^ the certificate is not trusted for this hostname"; exit 1; }

      - name: Probe 4 - the credentials log in
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          # pwd prints the landing directory, which is what FTP_REMOTE_DIR is
          # relative to; cls proves the session can actually read the account.
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 20;
            open -u '$FTP_USER' --env-password '$FTP_HOST';
            pwd;
            cls -1;
          "

      - name: Upload over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          set -eu
          : "${FTP_DIR:?set the FTP_REMOTE_DIR variable}"
          # --env-password keeps the password out of the process list and out of
          # any shell expansion, so a password with quotes or $ in it is safe.
          # Deliberately no `debug`: this log is public, and the levels that
          # trace the control conversation also carry the PASS command.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open -u '$FTP_USER' --env-password '$FTP_HOST';
            mirror --reverse --verbose --parallel=4 --no-perms _site '$FTP_DIR';
          "

# Adding --delete to the mirror line prunes remote files that are no longer in
# _site. Leave it off until a deploy has proved FTP_REMOTE_DIR points where you
# think it does: aimed one level too high, --delete would empty public_html.
